# Builds the dll on every push to master and publishes it, with the license, as a release
name: Release

on:
  push:
    branches: [master]

permissions:
  contents: write

jobs:
  release:
    runs-on: windows-latest

    steps:
      - uses: actions/checkout@v4
        with:
          submodules: true

      # dxil-spirv's libs only change with its commit or the CMake flags in the vcxproj, so they're built once per
      # change of either and restored from the cache after
      - name: dxil-spirv commit
        id: dxil-spirv
        shell: pwsh
        run: '"sha=$(git rev-parse HEAD:third_party/dxil-spirv)" >> $env:GITHUB_OUTPUT'

      - name: dxil-spirv cache
        id: dxil-spirv-cache
        uses: actions/cache@v4
        with:
          path: obj/dxil-spirv/lib/Release
          key: dxil-spirv-${{ runner.os }}-${{ steps.dxil-spirv.outputs.sha }}-${{ hashFiles('dlssg-to-xefg.vcxproj') }}

      # The only ones of dxil-spirv's submodules its C API needs, only to build it: our code includes just its C header
      - name: dxil-spirv dependencies
        if: steps.dxil-spirv-cache.outputs.cache-hit != 'true'
        run: git -C third_party/dxil-spirv submodule update --init third_party/spirv-headers subprojects/dxbc-spirv

      - uses: microsoft/setup-msbuild@v2

      - name: Build
        run: msbuild dlssg-to-xefg.sln -p:Configuration=Release -p:Platform=x64 -m -p:SkipDxilSpirv=${{ steps.dxil-spirv-cache.outputs.cache-hit == 'true' }}

      - name: Package
        shell: pwsh
        run: |
          $zip = "dlssg-to-xefg-${{ github.run_number }}.zip"
          Compress-Archive -Path bin\Release\dlssg_to_xefg_intel_is_better.dll, LICENSE -DestinationPath $zip
          "ZIP=$zip" >> $env:GITHUB_ENV

      - name: Release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $sha = "${{ github.sha }}".Substring(0, 7)
          gh release create "build-${{ github.run_number }}" $env:ZIP `
            --target "${{ github.sha }}" `
            --title "Build ${{ github.run_number }} ($sha)" `
            --notes "Built from $sha."
